name: Build and Package

on:
  push:
    branches:
      - '*'

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Maven 3.8.7
        uses: s4u/setup-maven-action@v1.11.0
        with:
          maven-version: 3.8.7

      - name: Install parent POM
        run: |
          mvn install -N -DskipTests \
            -DCLOUD_STORE_GROUP_ID=org.sunbird \
            -DCLOUD_STORE_ARTIFACT_ID=cloud-store-sdk_2.12 \
            -DCLOUD_STORE_VERSION=1.4.6

      - name: Build and Install jobs-core
        run: |
          cd jobs-core
          mvn clean install -T 1C -DskipTests \
            -DCLOUD_STORE_GROUP_ID=org.sunbird \
            -DCLOUD_STORE_ARTIFACT_ID=cloud-store-sdk_2.12 \
            -DCLOUD_STORE_VERSION=1.4.6

      - name : Build and Install Publish Pipeline
        run: |
          cd publish-pipeline
          mvn clean install -DskipTests \
            -DCLOUD_STORE_GROUP_ID=org.sunbird \
            -DCLOUD_STORE_ARTIFACT_ID=cloud-store-sdk_2.12 \
            -DCLOUD_STORE_VERSION=1.4.6

      - name: Download all dependencies for all modules
        run: |
          mvn dependency:go-offline -T 1C \
            -DCLOUD_STORE_GROUP_ID=org.sunbird \
            -DCLOUD_STORE_ARTIFACT_ID=cloud-store-sdk_2.12 \
            -DCLOUD_STORE_VERSION=1.4.6

      - name: Upload Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repository
          path: ~/.m2/repository

  build-modules:
    needs: build-core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [
          'post-publish-processor',
          'search-indexer',
          'auto-creator-v2',
          'content-auto-creator',
          'transaction-event-processor',
          'qrcode-image-generator',
          'dialcode-context-updater',
          'cassandra-data-migration',
          'live-video-stream-generator',
          'csp-migrator',
          'asset-enrichment',
          'video-stream-generator'
        ]
    steps:
      - uses: actions/checkout@v3

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Maven 3.8.7
        uses: s4u/setup-maven-action@v1.11.0
        with:
          maven-version: 3.8.7

      - name: Download Maven repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Build Module ${{ matrix.module }}
        run: |
          cd ${{ matrix.module }}
          mvn clean install -T 1C -DskipTests \
            -DCLOUD_STORE_GROUP_ID=org.sunbird \
            -DCLOUD_STORE_ARTIFACT_ID=cloud-store-sdk_2.12 \
            -DCLOUD_STORE_VERSION=1.4.6
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-artifact
          path: ~/.m2/repository/org/sunbird/${{ matrix.module }}

  combine-artifacts:
    needs: [build-core, build-modules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download Maven repository from core
        uses: actions/download-artifact@v4
        with:
          name: maven-repository
          path: ~/.m2/repository

      - uses: actions/checkout@v3
      - name: Download Maven repository from core
        uses: actions/download-artifact@v4
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download all module artifacts
        uses: actions/download-artifact@v4
        with:
          name: post-publish-processor-artifact
          path: ~/.m2/repository/org/sunbird/post-publish-processor

      - name: Download search-indexer artifact
        uses: actions/download-artifact@v4
        with:
          name: search-indexer-artifact
          path: ~/.m2/repository/org/sunbird/search-indexer

      - name: Download auto-creator-v2 artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-creator-v2-artifact
          path: ~/.m2/repository/org/sunbird/auto-creator-v2

      - name: Download content-auto-creator artifact
        uses: actions/download-artifact@v4
        with:
          name: content-auto-creator-artifact
          path: ~/.m2/repository/org/sunbird/content-auto-creator

      - name: Download transaction-event-processor artifact
        uses: actions/download-artifact@v4
        with:
          name: transaction-event-processor-artifact
          path: ~/.m2/repository/org/sunbird/transaction-event-processor
          
      - name: Download qrcode-image-generator artifact
        uses: actions/download-artifact@v4
        with:
          name: qrcode-image-generator-artifact
          path: ~/.m2/repository/org/sunbird/qrcode-image-generator

      - name: Download dialcode-context-updater artifact
        uses: actions/download-artifact@v4
        with:
          name: dialcode-context-updater-artifact
          path: ~/.m2/repository/org/sunbird/dialcode-context-updater

      - name: Download cassandra-data-migration artifact
        uses: actions/download-artifact@v4
        with:
          name: cassandra-data-migration-artifact
          path: ~/.m2/repository/org/sunbird/cassandra-data-migration

      - name: Download live-video-stream-generator artifact
        uses: actions/download-artifact@v4
        with:
          name: live-video-stream-generator-artifact
          path: ~/.m2/repository/org/sunbird/live-video-stream-generator

      - name: Download csp-migrator artifact
        uses: actions/download-artifact@v4
        with:
          name: csp-migrator-artifact
          path: ~/.m2/repository/org/sunbird/csp-migrator

      - name: Download asset-enrichment artifact
        uses: actions/download-artifact@v4
        with:
          name: asset-enrichment-artifact
          path: ~/.m2/repository/org/sunbird/asset-enrichment

      - name: Download video-stream-generator artifact
        uses: actions/download-artifact@v4
        with:
          name: video-stream-generator-artifact
          path: ~/.m2/repository/org/sunbird/video-stream-generator

      - name: Upload combined Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repository-combined
          path: ~/.m2/repository

  build-distribution:
    needs: combine-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Set up Maven 3.8.7
        uses: s4u/setup-maven-action@v1.11.0
        with:
          maven-version: 3.8.7

      - name: Download combined Maven repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repository-combined
          path: ~/.m2/repository

      - name: Build jobs-distribution
        working-directory: jobs-distribution
        run: |
          mvn package -T 1C -DskipTests

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-platform-jobs-distribution
          path: |
            jobs-distribution/target/*.tar.gz
